<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Атмосфера — дневник дней</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=PT+Mono&family=Marck+Script&family=Bad+Script&family=Pangolin&family=Underdog&family=Old+Standard+TT:ital@0;1&family=Amatic+SC:wght@700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Открыт с диска двойным щелчком: исходник без Vite пустой — переходим на собранный файл.
      if (location.protocol === 'file:' && !/\/docs\/index\.html$/i.test(location.pathname)) {
        location.replace('docs/index.html' + location.hash);
      }
      // GitHub Pages публикует корень репозитория: собранный сайт лежит в docs/
      if (/\.github\.io$/i.test(location.hostname) && !/\/docs\//i.test(location.pathname)) {
        location.replace(location.pathname.replace(/\/?(index\.html)?$/i, '/') + 'docs/' + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
